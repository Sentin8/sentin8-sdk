[package]
name = "sentin8-membus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sentin8 MemBus - library-only Memory Bus (direct Valkey, valkey://, no TLS)."

[lib]
name = "sentin8_membus"
path = "src/lib.rs"

[dependencies]
# Valkey GLIDE - the platform's mandated client engine (group DESIGN.md
# §3.1): glide-core owns TLS, reconnection, and backoff natively.
valkey-glide.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
futures-util.workspace = true
sentin8-config.workspace = true
# Cert-presenting Valkey connections (group DESIGN.md §3.1) - MemBus is a
# client of the TLS plane like every other consumer.
sentin8-middleware.workspace = true

[dev-dependencies]
tokio.workspace = true