[package]
name = "sentin8-bus-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAPI spec and Rust types for Sentin8:Bus (event bus)."

[lib]
name = "sentin8_bus_contracts"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
# OpenAPI schema support so the wire types register directly in the bus
# service's utoipa schema (same pattern as flow contracts).
utoipa.workspace = true