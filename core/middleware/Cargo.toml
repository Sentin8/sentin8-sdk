[package]
name = "sentin8-middleware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared axum middleware for Sentin8 services: Sentin8:Auth token verification, Sentin8:TLS context extraction, correlation ID, logging, recovery."

[dependencies]
utoipa = { version = "5", features = ["chrono", "uuid"] } # typed liveness schema (OAPEC-9)
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
# Valkey GLIDE - the platform's mandated client engine (group DESIGN.md
# §3.1): glide-core owns TLS, reconnection, and backoff natively.
valkey-glide.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
sentin8-errors.workspace = true
sentin8-config.workspace = true
once_cell.workspace = true
tracing-futures = "0.2"
http = "1"
parking_lot = "0.12"

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
# Test-only: install the Graviola PQ provider (reqwest panics without one).
sentin8-tls = { workspace = true }

