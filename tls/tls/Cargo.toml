[package]
name = "sentin8-tls"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sentin8 per-service Sentin8:TLS termination + host-context resolution platform library."

[lib]
name = "sentin8_tls"
path = "src/lib.rs"

[dependencies]
# Sentin8:TLS stack - Graviola provider (pure Rust, ML-KEM support, Sentin8:TLS 1.3 only)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.13"
# PQCA-2: ML-DSA-65 handshake signing for the PQ cert families. rustls
# 0.23 accepts the ML_DSA_65 SignatureScheme on TLS 1.3 suites
# (compatible_sigscheme_for_suites: algorithm() == None => tls13 suites);
# the SigningKey/Signer traits are implemented in this crate's pq_sign.rs.
ml-dsa = { version = "0.1", features = ["getrandom", "pkcs8", "zeroize"] }
# The OS-entropy source for the test-only PQ key generators.
getrandom = "0.3"
# The RNG trait surface the slh-dsa generator consumes (the same
# rand_core 0.10 the acme `generate_slh_root_key` adapter implements).
rand_core = { version = "0.10", default-features = false }
# PQCLIENT-1: SLH-DSA-SHA2-128s certificate VERIFICATION (the PQ root
# CA's signature family) - the pure-Rust verifier in pq_verify.rs. Same
# RustCrypto family and version the acme service mints the root with
# (`alloc` for the key/signature types; verification itself needs no
# RNG - the test generator uses the local getrandom adapter).
slh-dsa = { version = "0.2.0-rc.5", features = ["alloc"] }

# HTTP / async runtime
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
http = "1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database-free hostname resolution (design/
# sentin8-vertical-data-plane-contract.md §VDC.7): cache miss → Sys
# `GET /v1/resolve/hostname` with the embedding service's cert-bound
# `{dash}-tls` M2M workload. NO sqlx - the library never opens a SQL
# connection, so no service (platform or vertical) gains platform-database
# access by embedding it.
sentin8-m2m = { workspace = true }

# Logging
tracing = { workspace = true }

# IDs / time
uuid = { workspace = true }
chrono = { workspace = true }

# Misc
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
parking_lot = "0.12"
futures-util = { workspace = true }
reqwest = { workspace = true }

# Internal workspace crates
sentin8-config = { workspace = true }
sentin8-errors = { workspace = true }
sentin8-middleware = { workspace = true }
sentin8-service-discovery = { workspace = true }
sentin8-tls-contracts = { workspace = true }