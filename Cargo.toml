# sentin8-sdk - The Sentin8 Shared Library Workspace (RS §2.3)
#
# ONE cargo workspace containing every shared platform crate, every service
# SDK crate (client/contracts), and the facade crate `sentin8`.
# Consumer repos (services, starters, verticals, apps) depend on this
# workspace as a single pinned git dependency:
#
#     sentin8 = { git = "...", tag = "sdk-v0.2.0" }
#
# Internal path deps are INTRA-REPO (allowed - RS-5 bans only cross-repo
# path deps). All shared dependency versions are centralized here.

[workspace]
resolver = "2"
members = [
    # ── core layer (L0/L1) ──
    "core/errors",
    "core/crypto",
    "core/config",
    "core/build-info",
    "core/idempotency",
    "core/registration",
    "core/rfw",
    "core/openapi",
    "core/middleware",
    "core/service-discovery",
    # ── identity layer (L2) ──
    "identity/jwt",
    "identity/fapi",
    "identity/auth-client",
    "identity/m2m",
    "identity/workload-registry",
    # ── tls plane (L3) ──
    "tls/tls",
    "tls/contracts",
    # ── bus plane (L3/L4) �──
    "bus/contracts",
    "bus/membus",
    "bus/client",
    "bus/outbox",
    # ── shield engine (L5) ──
    "shield/shield",
    # ── shell + audit (L6) ──
    "shell/shell",
    "shell/audit",
    # ── service SDK crates ──
    # ── facade ──
    "facade",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sentin8/sentin8-sdk"
rust-version = "1.85"

[workspace.dependencies]
# ── HTTP / async runtime ──
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
tokio-stream = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ──
thiserror = "1"
anyhow = "1"

# ── Logging / tracing ──
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-futures = "0.2"
once_cell = "1"

# ── Database ──
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
# Valkey GLIDE - the platform's mandated client engine (group DESIGN.md §3.1):
# glide-core owns TLS, reconnection, and backoff natively.
valkey-glide = "0.9.0"
arc-swap = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# ── Auth/crypto ──
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
hmac = "0.12"
rustls-graviola = "0.4"
graviola = "0.7"

# ── OpenAPI/docs ──
utoipa = { version = "5", features = ["chrono", "uuid"] }

# ── Utility ──
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
jsonwebtoken = "9"
mockito = "1"

# ── Crypto / encoding extras ──
sha1 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdsa-core", "pem"] }
ciborium = "0.2"
aes-gcm = "0.10"
zeroize = "1"
rsa = { version = "0.9", features = ["sha2"] }
bcrypt = "0.15"

# ── Domain types ──
ulid = { version = "1", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
validator = { version = "0.18", features = ["derive"] }

# ── Observability ──
prometheus = "0.13"
opentelemetry = "0.27"
time = "0.3.36"

# ── Workspace-internal crate path deps (intra-repo) ──
sentin8-errors = { path = "core/errors" }
sentin8-crypto = { path = "core/crypto" }
sentin8-config = { path = "core/config" }
sentin8-build-info = { path = "core/build-info" }
sentin8-idempotency = { path = "core/idempotency" }
sentin8-registration = { path = "core/registration" }
sentin8-rfw = { path = "core/rfw" }
sentin8-openapi = { path = "core/openapi" }
sentin8-middleware = { path = "core/middleware" }
sentin8-service-discovery = { path = "core/service-discovery" }
sentin8-jwt = { path = "identity/jwt" }
sentin8-fapiclient = { path = "identity/fapi" }
sentin8-auth-client = { path = "identity/auth-client" }
sentin8-m2m = { path = "identity/m2m" }
sentin8-tls = { path = "tls/tls" }
sentin8-tls-contracts = { path = "tls/contracts" }
sentin8-bus-contracts = { path = "bus/contracts" }
sentin8-membus = { path = "bus/membus" }
sentin8-workload-registry = { path = "identity/workload-registry" }
sentin8-bus-client = { path = "bus/client" }
sentin8-outbox = { path = "bus/outbox" }
sentin8-shield = { path = "shield/shield" }
sentin8-shell = { path = "shell/shell" }
sentin8-audit = { path = "shell/audit" }

# Shield engine (vendor package - the ONLY place the vendor name appears;
# see design §2.4 / AGENTS branding rule).
shield = { version = "4.12", package = "cedar-policy" }