[package]
name = "sentin8-auth-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust client library for Sentin8:Auth (identity, OAuth/OIDC, sessions)."

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
rand.workspace = true
base64.workspace = true
tokio.workspace = true
http = "1"
jsonwebtoken.workspace = true
rsa.workspace = true
ml-dsa = { version = "0.1", features = ["getrandom", "pkcs8", "zeroize"] }
sentin8-jwt.workspace = true
sentin8-config.workspace = true
sentin8-workload-registry.workspace = true
sentin8-middleware.workspace = true

[dev-dependencies]
# Test-only: install the Graviola PQ provider (reqwest panics without one).
sentin8-tls = { workspace = true }