[package]
name = "sentin8-fapiclient"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Discovery-driven FAPI-compliant OAuth client for Sentin8 (PAR, DPoP, mSentin8:TLS, JARM, JAR, iss, JWKS caching, token auto-refresh)."

[dependencies]
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
jsonwebtoken = { workspace = true }
p256 = { workspace = true }
ml-dsa = { version = "0.1", features = ["getrandom", "pkcs8", "zeroize"] }
sentin8-jwt.workspace = true