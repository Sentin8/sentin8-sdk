[package]
name = "sentin8-workload-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sentin8 workload registry map — the enroll-published token-free M2M authorization record (workload CN → vertical, service_type, scopes, enabled)."

[lib]
name = "sentin8_workload_registry"
path = "src/lib.rs"

[dependencies]
valkey-glide.workspace = true
# Cert-presenting Valkey connections (group DESIGN.md §3.1) — the map
# rides the TLS plane like every other Valkey client.
sentin8-middleware.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sentin8-config.workspace = true